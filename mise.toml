[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error; also checks cbindgen"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
  "cbindgen --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting; also checks amm-client without egui and formats only the workspace members"
dir = "{{config_root}}"
# fmt names each member: --all would also format the amml path dependencies
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo check -p amm-client --no-default-features --features test-support",
  "cargo clippy -p amm-client --no-default-features --features test-support -- -D warnings",
  "cargo fmt --check -p amm-core -p amm-abi -p amm-store -p amm-ui -p amm-client -p amm-ffi -p amm-overlay -p amm-amml -p amm-bench -p amm-e2e",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace --no-tests=pass"

[tasks.header]
description = "Regenerates include/alaydriem_mod_manager.h from amm-abi"
dir = "{{config_root}}"
run = [
  "cbindgen --config crates/amm-abi/cbindgen.toml --crate amm-abi --output include/alaydriem_mod_manager.h crates/amm-abi",
]

[tasks.header-check]
description = "Fails when include/alaydriem_mod_manager.h is out of date with amm-abi"
dir = "{{config_root}}"
run = [
  "cbindgen --verify --config crates/amm-abi/cbindgen.toml --crate amm-abi --output include/alaydriem_mod_manager.h crates/amm-abi",
]

[tasks.package]
description = "Builds dist/@amml/modmanager/ (amml_modmanager.dll, amml_modmanager.pdb, amml.hcl), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
# cargo names the cdylib amml_modmanager.dll, the module name mods find the manager by
run = '''
set -e
cargo build --release -p amm-amml
rm -rf dist/@amml/modmanager
mkdir -p dist/@amml/modmanager
cp target/release/amml_modmanager.dll dist/@amml/modmanager/amml_modmanager.dll
cp target/release/amml_modmanager.pdb dist/@amml/modmanager/amml_modmanager.pdb
cp crates/amm-amml/packaging/amml.hcl dist/@amml/modmanager/amml.hcl
echo "built dist/@amml/modmanager"
'''

[tasks.e2e]
description = "End-to-end scenarios in amm-e2e"
dir = "{{config_root}}"
run = "cargo nextest run -p amm-e2e --no-tests=pass"

[tasks.bench]
description = "Criterion benches in amm-bench; arguments narrow the run"
dir = "{{config_root}}"
run = "cargo bench -p amm-bench --"

[tasks.panel-shots]
description = "Writes the manager panel screenshots into docs/findings/amm-ui"
dir = "{{config_root}}"
run = "cargo run --release -p amm-ui --example panel_shots -- docs/findings/amm-ui"

[tasks."panel-shots:pseudo"]
description = "Writes the manager panel screenshots in the en_XA pseudo-locale into docs/findings/amm-ui/en_XA"
dir = "{{config_root}}"
run = "cargo run --release -p amm-ui --example panel_shots -- docs/findings/amm-ui/en_XA --locale en_XA"

# Translation catalogs: each crate that shows text has crates/<crate>/i18n/ holding <domain>.pot
# (written from its Message enum), the translators' <locale>.po files, and packs/<locale>.json.

[tasks."i18n:extract"]
description = "Writes each crate's i18n/<domain>.pot from its Message enum"
dir = "{{config_root}}"
run = [
  "cargo run -q -p amm-ui --example amm_i18n_extract",
]

[tasks."i18n:check"]
description = "Fails when a crate's .pot is out of date with its Message enum"
dir = "{{config_root}}"
run = [
  "cargo run -q -p amm-ui --example amm_i18n_extract -- --check",
]

[tasks."i18n:build"]
description = "Compiles each crate's i18n/<locale>.po into i18n/packs/<locale>.json; a locale under 90 % coverage is not shipped"
dir = "{{config_root}}"
shell = "bash -c"
run = [
  'for dir in crates/*/i18n; do [ -d "$dir" ] || continue; bash scripts/amml-i18n-tool.sh build "$dir" "$dir/packs" || exit 1; done',
]

[tasks."i18n:pseudo"]
description = "Writes the en_XA pseudo-locale pack of each crate's .pot into i18n/packs/en_XA.json"
dir = "{{config_root}}"
shell = "bash -c"
run = [
  'for pot in crates/*/i18n/*.pot; do [ -f "$pot" ] || continue; bash scripts/amml-i18n-tool.sh pseudo "$pot" "$(dirname "$pot")/packs/en_XA.json" || exit 1; done',
]

[tasks."i18n:report"]
description = "Prints the translation coverage of each crate's locales against its .pot"
dir = "{{config_root}}"
shell = "bash -c"
run = [
  'for pot in crates/*/i18n/*.pot; do [ -f "$pot" ] || continue; echo "## $pot"; bash scripts/amml-i18n-tool.sh report "$pot" "$(dirname "$pot")" || exit 1; done',
]

[tools]
"cargo:cbindgen" = "0.29.2"
# scripts/amml-i18n-tool.sh reads cargo metadata with it
jq = "1.8.1"

[tasks.install]
description = "Runs package, then copies dist/@amml/modmanager into mods/amml/@amml/modmanager of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, default 1.26.60.05). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" default="1.26.60.05" help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:-1.26.60.05}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@amml/modmanager"
mkdir -p "$target"
cp -r dist/@amml/modmanager/. "$target/"
echo "installed dist/@amml/modmanager -> $target"
'''
