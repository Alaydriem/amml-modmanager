[package]
name = "amm-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "amml_managerprobe"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[dependencies]
amm-abi.workspace = true
amm-client.workspace = true
amm-core = { workspace = true, features = ["egui"] }
amml-api.workspace = true
egui.workspace = true
hcl-rs.workspace = true

[dev-dependencies]
# The real manager mod, so the probe runs against its tables in one `FakeGame`
amm-amml = { path = "../amm-amml" }
# `FakeTable::ready` and `gone`: the loader events of the manager tables
amm-client = { workspace = true, features = ["test-support"] }
# `FakeGame`, the v3 loader table the probe runs on in tests
amml-api = { workspace = true, features = ["test"] }
tempfile.workspace = true

# Named apart from the manager's example: two examples of one name share one output file in `target/`
[[example]]
name = "write_manifest_managerprobe"
path = "examples/write_manifest.rs"
