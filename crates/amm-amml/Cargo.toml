[package]
name = "amm-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "amml_modmanager"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[dependencies]
amm-abi.workspace = true
amm-core.workspace = true
amm-ffi.workspace = true
amm-overlay.workspace = true
amml-api.workspace = true
curia.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `FakeGame`, the v3 loader table the manager mod runs on in tests
amml-api = { workspace = true, features = ["test"] }
hcl-rs.workspace = true
object.workspace = true
tempfile.workspace = true
# WARP devices and targets, so a `FramePresent` lends the manager a real surface
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

# Named apart from the probe's example: two examples of one name share one output file in `target/`
[[example]]
name = "write_manifest_modmanager"
path = "examples/write_manifest.rs"
