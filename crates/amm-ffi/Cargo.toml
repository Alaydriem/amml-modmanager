[package]
name = "amm-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
crate-type = ["rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[dependencies]
amm-core = { workspace = true, features = ["egui"] }
amm-abi.workspace = true
amml-api.workspace = true
amm-store.workspace = true
amm-ui.workspace = true
amml-ui.workspace = true
arc-swap.workspace = true
curia.workspace = true
chrono.workspace = true
hcl-rs.workspace = true
serde_json.workspace = true
time.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `FakeGame`, a loader table for the registry tests
amml-api = { workspace = true, features = ["test"] }
amml-abi.workspace = true
# The loader's provider registry, for a test registry with two owners
amml-runtime.workspace = true
tempfile.workspace = true
png.workspace = true
