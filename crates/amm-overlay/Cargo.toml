[package]
name = "amm-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true

[dependencies]
amm-abi.workspace = true
amm-ffi.workspace = true
amml-api.workspace = true
curia.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
# `FakeGame`, which lends a `FramePresent` surface built from WARP objects to a listener
amml-api = { workspace = true, features = ["test"] }
amml-abi.workspace = true

[build-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }
